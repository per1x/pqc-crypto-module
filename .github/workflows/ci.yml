name: CI

on:
  push:
    branches: [main, zu3eg-fpga-crypto]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl:
    name: RTL — lint, simulate, synthesise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RTL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            verilator iverilog yosys python3-venv

      - name: Create the cocotb environment
        run: |
          python3 -m venv .venv-rtl
          ./.venv-rtl/bin/pip install --quiet cocotb

      # Every module lints as its own top level, so modules nothing
      # instantiates are still checked. Zero warnings is the bar.
      - name: Lint
        run: ./tools/rtl_lint.sh

      - name: Synthesisability
        run: ./tools/rtl_synth_check.sh

      - name: cocotb regression
        run: ./tools/rtl_sim.sh

  host:
    name: Host software — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libssl-dev

      # liboqs is not packaged; build the pinned release from source.
      - name: Build liboqs
        run: |
          git clone --depth 1 --branch 0.16.0 \
            https://github.com/open-quantum-safe/liboqs /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/liboqs/build --target install
          sudo ldconfig

      - name: Fetch ACVP vectors
        run: ./tools/fetch_vectors.sh

      - name: Build
        run: |
          cmake -S . -B build -GNinja
          cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each scanner self-tests on synthetic samples first: one that cannot
      # find anything proves nothing when it reports a clean scan.
      - name: Constant-time source audit
        run: |
          python3 tools/ct_audit.py --self-test
          python3 tools/ct_audit.py

      - name: Zeroization structure check
        run: |
          python3 tools/check_zeroize.py --self-test
          python3 tools/check_zeroize.py

      - name: SP 800-90B estimators against the specification's worked examples
        run: python3 tools/sp800_90b.py --selftest

  service:
    name: Service layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 远程口是 mTLS（service/pqcs_tls.c），所以这一步现在需要 OpenSSL 的开发包。
      # ubuntu-latest 自带 libssl-dev，显式装一次是为了让"哪天镜像不带了"
      # 表现为这一行失败，而不是一堆看不懂的链接错误。
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build daemon, client library and demo
        run: make -C service
      # mTLS 那一层的回归：一条正例 + 三条否定（别家 CA / 不出示证书 / CN 不在 ACL）。
      # 不需要板子，也不碰任何真的凭据 —— 每轮临时生成一套 PKI。
      - name: mTLS regression (positive + three negatives)
        run: ./tools/tls_regress.sh

